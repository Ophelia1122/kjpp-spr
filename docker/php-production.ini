; Setelan PHP produksi untuk container NAS.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 300
expose_php = Off

; OPcache — penyebab utama lambat di laptop dulu (lihat docs/deploy-ugreen-nas.md).
; validate_timestamps=0: kode tidak dicek ulang tiap request (tercepat).
; Setiap update aplikasi WAJIB rebuild/restart container.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

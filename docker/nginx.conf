server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Teruskan Host asli BESERTA port (mis. 192.168.1.5:8088). fastcgi_params
        # bawaan mengoper $host yang sudah membuang port -> Laravel mengira jalan
        # di port 80 & redirect /login kehilangan portnya (2026-09-16, NAS UGREEN:
        # browser malah mendarat di panel UGOS port 80 -> 9443).
        fastcgi_param HTTP_HOST $http_host;
        # Konversi proposal ke PDF (LibreOffice) bisa makan waktu.
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

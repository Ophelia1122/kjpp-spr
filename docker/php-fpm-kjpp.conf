[www]
; Bawaan PHP-FPM menghapus environment variable container (clear_env = yes),
; sehingga LIBREOFFICE_BIN dll. tidak terbaca aplikasi.
clear_env = no

; LibreOffice butuh HOME yang bisa ditulis saat dijalankan sebagai www-data.
env[HOME] = /tmp

; Disesuaikan untuk Intel N100 + RAM 8 GB (DXP2800).
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
request_terminate_timeout = 300

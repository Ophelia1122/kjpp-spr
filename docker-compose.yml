# Deploy KJPP ke UGREEN NAS — lihat docs/tutorial-install-ugreen-nas.md
# Semua nilai ${...} dibaca dari file .env di folder yang sama.

services:
  app:
    build: .
    image: kjpp-app:latest
    container_name: kjpp-app
    restart: unless-stopped
    ports:
      # Ganti 8080 kalau port itu sudah dipakai aplikasi lain di NAS.
      - "8080:80"
    volumes:
      # .env dipakai Laravel & compose; storage permanen di disk NAS.
      - ./.env:/var/www/html/.env:ro
      - ./storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    networks:
      - kjpp-network

  db:
    image: mysql:8.4
    container_name: kjpp-db
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=512M"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    networks:
      - kjpp-network

networks:
  kjpp-network:
    driver: bridge

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kjpp-app
    restart: unless-stopped
    ports:
      # Ubah "8080" sesuai port kosong di NAS Anda (cek di Container Manager)
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kjpp_db}
      DB_USERNAME: ${DB_USERNAME:-kjpp_user}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Storage & PDF hasil generate disimpan permanen di disk NAS,
      # tidak hilang saat container di-restart/update image.
      - ./storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kjpp-network

  db:
    image: mysql:8.0
    container_name: kjpp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kjpp_db}
      MYSQL_USER: ${DB_USERNAME:-kjpp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Data MySQL disimpan permanen di folder NAS -> aman dari restart/upgrade
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kjpp-network

networks:
  kjpp-network:
    driver: bridge
